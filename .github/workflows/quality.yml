name: Quality checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # Temporary until ESLint dependencies and the npm lockfile are committed together.
      - name: Install ESLint tooling (temporary)
        run: npm install --no-save --package-lock=false eslint@^9 eslint-config-expo
      - name: Lint
        run: npm run lint
