name: Deploy Expo Hosting

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expo-hosting-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    # Do not expose EXPO_TOKEN to code from forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Verify Expo token is configured
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Set repository Actions secret EXPO_TOKEN before deploying."
            exit 1
          fi
      - name: Export web app
        run: npx expo export --platform web
      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: npx --yes eas-cli@latest deploy --non-interactive
      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: npx --yes eas-cli@latest deploy --prod --non-interactive
